name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      # pure-logic tests only; model-backed tests download ~1.2GB
      - run: >-
          pytest -q tests/test_rrf.py tests/test_chunker.py tests/test_citation_mapper.py
          tests/test_parser.py tests/test_extraction.py tests/test_extraction_schemas.py
          tests/test_extraction_eval.py tests/test_review.py tests/test_validate_gold.py
          tests/test_refusal_eval.py tests/test_eval_runner.py
          tests/test_phase6_inventory.py tests/test_eligibility_types.py
      - run: python scripts/validate_phase6_inventory.py
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run build
