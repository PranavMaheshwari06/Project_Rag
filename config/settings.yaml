# Single source of truth for every tunable knob.
# core/config.py loads this file; a few env vars (GEMINI_API_KEY, QDRANT_URL,
# VECTOR_BACKEND, LLM_MODEL, EMBED_MODEL, RERANK_MODEL) override it.

paths:
  registry_path: sources/registry.yaml   # every source URL + provenance
  manifest_path: sources/manifest.json   # crawl results (committed)
  raw_dir: data/raw                      # raw HTML/PDF cache (gitignored)
  processed_path: data/processed/chunks.jsonl
  index_dir: data/index

crawl:
  # identifies us to site owners; robots.txt rules are matched on "StudyAbroadRAG"
  user_agent: "StudyAbroadRAG/0.1 (+https://github.com/PranavMaheshwari06/Project_Rag)"
  delay_seconds: 2.0         # min gap between requests to one host (robots Crawl-delay wins if larger)
  timeout_seconds: 30
  max_bytes: 20000000        # abort downloads above ~20MB
  max_pdf_pages: 80          # parse at most this many pages per PDF

chunking:
  target_tokens: 256        # whitespace words; prose runs ~1.25 bge tokens/word, so 384 max + overlap fits 512
  max_tokens: 384
  overlap_ratio: 0.12        # ~12% of target carried into the next chunk
  min_section_tokens: 40     # sections smaller than this merge with neighbours
  model_token_limit: 510     # real tokenizer count; chunks above this are re-split (German/tables run 2x the word count)

retrieval:
  vector_backend: memory     # memory | qdrant
  qdrant_url: http://localhost:6333
  collection: engineerdoc_chunks
  dense_top_k: 20
  bm25_top_k: 20
  rrf_k: 60
  rerank_n: 10
  final_top_k: 5

models:
  embed_model: BAAI/bge-small-en-v1.5
  rerank_model: BAAI/bge-reranker-base
  embed_batch_size: 16       # small batches so CPU stays usable
  llm_model: gemini-3.8-flash  # free tier; model names and limits change, re-check before relying on them
  llm_base_url: https://generativelanguage.googleapis.com/v1beta/openai/  # OpenAI-compatible endpoint

generation:
  refusal_threshold: 0.3     # top rerank score below this -> explicit refusal
  max_evidence_chunks: 4
  max_sentences_per_chunk: 3

evaluation:
  gold_path: evaluation/datasets/gold_qa.jsonl   # new study-abroad gold set lands in Phase 4
  k_values: [5, 10]
  benchmark_out: frontend/public/benchmark.json
  readme_path: README.md
