# The API image and the UI on localhost: `make ingest index`, then `docker compose up --build`.
# Without Docker: make install && make ingest && make index && make run.

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    # passed from the shell or .env; empty means the default. No ADMIN_TOKEN: /ingest and /evaluate need the crawled
    # pages and a writable tree, which the image does not have, so they stay off.
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DAILY_LLM_CALL_CAP=${DAILY_LLM_CALL_CAP:-}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
    mem_limit: 4g

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      api:
        condition: service_healthy
