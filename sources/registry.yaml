# Every source the corpus is built from. Official sites only.
# Fields: id (stable, also the raw-cache filename), url, country (ISO code),
#   layer: rules | scholarship | university
#   stage (optional): before_applying | visa_document | visa_funds | arrival | after_graduation
#   university, programme, title (optional). City pages carry the university
#   whose city they cover, so they can be filtered together.
# `make crawl` fetches these into data/raw/ and records results in manifest.json.

